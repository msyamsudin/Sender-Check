name: CI

on:
  push:
    branches: [main]
    # Tag ikut memicu CI supaya job `release-check` dapat memeriksa tag itu sendiri. Tanpa ini,
    # mendorong tag tidak menjalankan apa pun: tag yang salah label tidak akan ketahuan, dan tag
    # adalah tempat catatan rilis hidup sekarang.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, dan release gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Riwayat penuh dan tag dibutuhkan `pnpm changelog:check`, yang membandingkan setiap
          # baris indeks CHANGELOG dengan tag yang benar-benar ada beserta pesannya. Checkout
          # dangkal tidak memuat tag sama sekali, dan pemeriksa yang tidak menemukan tag akan
          # melaporkan masalah yang menuduh repositori padahal checkout-nya yang kurang.
          fetch-depth: 0
          fetch-tags: true

      # Versi pnpm diambil dari field `packageManager` di package.json, sehingga
      # CI dan mesin pengembang tidak dapat menyimpang.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # `tools/console/dist/` diabaikan git, sehingga tidak ada di checkout bersih.
      # Dibangun di sini karena dua hal bergantung padanya: test yang memastikan bundel
      # yang ditempel ke konsol Firefox tidak tertinggal dari sumbernya, dan langkah
      # `pnpm docs:check` yang menautkan direktori bundel itu dari dokumentasi.
      - name: Build bundel skrip konsol
        run: pnpm console:build

      # Ekstensi dibangun di sini walaupun testnya berjalan tanpa browser. Alasannya
      # ditemukan saat mengerjakannya: impor CSS yang salah path tidak menggagalkan
      # typecheck maupun test mana pun, dan hanya muncul sebagai kegagalan build. Berkas
      # hasilnya (`.output/`) diabaikan git, jadi langkah ini tidak mengubah repositori.
      - name: Build ekstensi Firefox
        run: pnpm extension:build

      # Dijalankan terpisah dari test agar pesan kegagalannya menyebut tautan mana
      # yang rusak, bukan sekadar satu assertion yang gagal.
      - name: Periksa tautan dokumentasi
        run: pnpm docs:check

      # Termasuk test arsitektur (core bebas DOM/jaringan/jam), test kelengkapan
      # katalog rule, dan penjaga encoding berkas.
      #
      # Memakai `test:report`, bukan `test`, karena pemeriksaan klaim dokumentasi di bawah
      # membutuhkan laporan JSON dari run yang sama. Keluarannya tetap sama: reporter default
      # ikut berjalan, sehingga kegagalan test tetap terbaca di log.
      - name: Test
        run: pnpm test:report

      # Membandingkan angka yang dikutip dokumentasi (jumlah test, berkas, kasus corpus) dan
      # klaim keadaan (mis. "direktori ini kosong") dengan kenyataan. Harus berjalan **setelah**
      # test: ia membaca laporan run di atas, bukan menghitung ulang dari sumber — jumlah test
      # tidak dapat dihitung dari sumber karena sebagian test dibangkitkan dari data.
      - name: Periksa klaim dokumentasi
        run: pnpm docs:claims

      # Menyusul langkah di atas karena keduanya memeriksa hal yang sama dari arah berbeda:
      # yang pertama memeriksa angka di dokumentasi, yang ini memeriksa klaim baris indeks
      # CHANGELOG terhadap tag yang benar-benar ada. `release-check` hanya memeriksa tag yang
      # baru didorong, sehingga baris lama tidak pernah diperiksa siapa pun setelah rilisnya lewat.
      - name: Periksa indeks CHANGELOG terhadap tag
        run: pnpm changelog:check

      # Menjalankan release gate. Keluar dengan kode 1 bila precision atau nag rate
      # tidak memenuhi ambang, sehingga pull request yang menurunkan presisi gagal.
      - name: Corpus dan release gate
        run: pnpm corpus

      - name: Unggah laporan corpus
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corpus-report
          path: tools/corpus/reports/corpus-report.md
          if-no-files-found: warn
          retention-days: 30

  # Catatan rilis proyek ini hidup di pesan tag, bukan di berkas di dalam repositori. Karena itu
  # tag harus diperiksa seperti artefak lain: ia menyebut versi paket dan versi algoritma yang
  # benar-benar dirilis, dan keduanya tidak dapat direkonstruksi dari kode setelah tag tersebar.
  release-check:
    name: Tag cocok dengan versi paket dan versi algoritma
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Pesan tag yang dianotasi hanya ada bila seluruh riwayat dan tag ikut diambil.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # `actions/checkout` meninggalkan ref tag sebagai **tag ringan** yang menunjuk commit pada
      # peristiwa tag, sehingga `%(contents)`-nya berisi pesan commit, bukan pesan tag. Itu
      # benar-benar terjadi pada `v0.4.0`: penjaga ini gagal walaupun pesan tagnya benar, dan
      # kegagalannya menyesatkan. Objek tag dianotasi kini diambil ulang secara eksplisit, lalu
      # jenisnya diperiksa — tag ringan memang tidak punya catatan rilis, dan itu kegagalan yang
      # perlu disebut apa adanya, bukan disamarkan sebagai pesan yang salah.
      - name: Ambil objek tag yang dianotasi
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]; then
            echo "::error::$GITHUB_REF_NAME bukan tag yang dianotasi, sehingga tidak punya catatan rilis"
            exit 1
          fi

      - name: Tag harus sama dengan v + version di package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME tidak cocok dengan versi package.json $version"
            exit 1
          fi

      # Pesan tag adalah satu-satunya catatan rilis, jadi ia wajib menyebut versi algoritma yang
      # benar-benar ikut dirilis. Angka yang salah di sini tidak akan pernah terlihat dari kode.
      - name: Pesan tag harus menyebut ALGORITHM_VERSION yang benar
        run: |
          algorithm=$(sed -n "s/^export const ALGORITHM_VERSION = '\(.*\)';/\1/p" packages/core/src/version.ts)
          if [ -z "$algorithm" ]; then
            echo "::error::ALGORITHM_VERSION tidak terbaca dari packages/core/src/version.ts"
            exit 1
          fi

          message=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          if ! printf '%s' "$message" | grep -qF "ALGORITHM_VERSION: $algorithm"; then
            echo "::error::pesan tag harus memuat baris 'ALGORITHM_VERSION: $algorithm'"
            printf '%s\n' "$message"
            exit 1
          fi

  # Rilis otomatis: tidak ada langkah manual, dan itu memang tujuannya — yang tidak dikerjakan
  # manusia tidak dapat terlupa. Yang diputuskan mesin ada di `tools/release/src/version.ts`, dan
  # aturannya dijaga test, karena tidak ada mata manusia yang memeriksanya lagi.
  release:
    name: Rilis otomatis
    # `needs` inilah yang menggantikan pemeriksaan manual sebelum merilis: tag hanya dibuat
    # setelah typecheck, test, dan release gate corpus lulus pada commit yang sama.
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Job ini satu-satunya yang menulis ke repositori: ia mendorong commit versi dan tag.
    permissions:
      contents: write

    # Dua push berturut-turut tidak boleh menghitung versi dari keadaan yang sama.
    concurrency:
      group: release-main
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Butuh seluruh riwayat dan tag: versi dihitung dari commit sejak tag terakhir, dan
          # catatan rilis dibentuk dari badan commit hasil squash merge.
          fetch-depth: 0
          # `fetch-depth: 0` mengambil riwayat penuh **tanpa** tag; tag hanya ikut bila input ini
          # dinyalakan. Tanpa itu, rilis kedua melihat repositori seolah belum pernah dirilis —
          # seluruh riwayat dihitung ulang, satu perbaikan keluar sebagai `0.5.0`, dan versi
          # algoritma naik tanpa sebab. `prepare.ts` kini menolak keadaan itu, tetapi menolak
          # bukan memperbaiki: tag-nya tetap harus diambil.
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Menghitung versi paket dan versi algoritma, menjalankan release gate, lalu menulis
      # package.json, version.ts, baris indeks CHANGELOG.md, dan catatan rilis di luar repositori.
      - name: Hitung versi dan susun catatan rilis
        id: prepare
        env:
          RELEASE_NOTES_PATH: ${{ runner.temp }}/release-notes.md
        run: node tools/release/src/prepare.ts

      # Pesan tag adalah catatan rilisnya, jadi `-F` dipakai alih-alih `-m`: tidak ada teks yang
      # perlu dikutip ulang, dan tidak ada salinan kedua yang bisa menyimpang.
      - name: Commit, tag, dan dorong
        if: steps.prepare.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          NOTES_PATH: ${{ runner.temp }}/release-notes.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $VERSION"
          git tag -a "v$VERSION" -F "$NOTES_PATH"
          git push origin main
          git push origin "v$VERSION"

      # `--notes-from-tag` menjadikan pesan tag satu-satunya sumber catatan, sehingga GitHub
      # Release dan tag tidak dapat menceritakan hal yang berbeda.
      - name: Buat GitHub Release
        if: steps.prepare.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: gh release create "v$VERSION" --verify-tag --notes-from-tag
